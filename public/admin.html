<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>管理后台 · DOCLANE</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/styles.css" />
<style>
  /* 管理后台专属样式（沿用整体 editoral/mono 美学） */
  .admin-main { flex: 1; min-height: 0; overflow-y: auto; padding: 28px 40px 48px; max-width: 1280px; width: 100%; margin: 0 auto; }
  .admin-head h1 { font-size: 26px; font-weight: 700; margin: 0 0 4px; }
  .admin-head p { color: var(--ink-soft); font-size: 13px; margin: 0 0 22px; }
  .adm-summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin-bottom: 28px; }
  .adm-card { border: 1px solid var(--line); background: var(--paper-card); padding: 16px 18px; }
  .adm-card .num { font-family: var(--serif); font-size: 30px; font-weight: 600; }
  .adm-card .lbl { font-family: var(--mono); font-size: 10px; letter-spacing: .1em; color: var(--ink-faint); margin-top: 4px; }
  .adm-sec-title { font-family: var(--mono); font-size: 12px; letter-spacing: .12em; color: var(--accent-deep); margin: 26px 0 12px; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
  .adm-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .adm-table th { font-family: var(--mono); font-size: 10px; letter-spacing: .08em; color: var(--ink-faint); text-align: left; padding: 8px 10px; border-bottom: 2px solid var(--line-strong); }
  .adm-table td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .adm-table tr:hover td { background: var(--paper-deep); }
  .adm-table .mono { font-size: 11px; }
  .pill-role { font-family: var(--mono); font-size: 9.5px; padding: 1px 6px; border: 1px solid var(--accent); color: var(--accent-deep); background: var(--accent-soft); border-radius: 2px; }
  .pill-role.user { border-color: var(--line-strong); color: var(--ink-soft); background: transparent; }
  .pill-cat { font-family: var(--mono); font-size: 9.5px; padding: 1px 6px; border: 1px solid var(--line-strong); border-radius: 2px; color: var(--ink-soft); }
  .pill-cat.bug { border-color: var(--accent); color: var(--accent-deep); }
  .fb-item { border: 1px solid var(--line); background: var(--paper-card); padding: 13px 16px; margin-bottom: 8px; }
  .fb-top { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .fb-mail { font-family: var(--mono); font-size: 11px; color: var(--ink-soft); }
  .fb-time { font-family: var(--mono); font-size: 10px; color: var(--ink-faint); margin-left: auto; }
  .fb-body { font-size: 13px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; }
  .fb-empty { color: var(--ink-faint); font-size: 12px; padding: 20px 4px; }
  .adm-note { font-family: var(--mono); font-size: 10px; color: var(--ink-faint); margin-top: 6px; }
</style>
</head>
<body>
<div class="grain"></div>

<!-- 启动屏 -->
<div id="boot-screen" class="boot-screen">
  <span class="boot-brand">DOCLANE</span>
  <i class="boot-hint mono">鉴权中…</i>
</div>

<header class="appbar">
  <a class="brand" href="/app.html">
    <span class="brand-mark">D</span>
    <span class="brand-text">
      <span class="brand-name">DOCLANE</span>
      <span class="brand-sub">管理后台</span>
    </span>
  </a>
  <div class="appbar-right">
    <a class="btn btn-ghost" href="/app.html">← 返回工作台</a>
    <button id="btn-logout" class="btn btn-ghost" title="退出登录">退出</button>
  </div>
</header>

<main class="admin-main">
  <div id="admin-body" hidden>
    <div class="admin-head">
      <h1>管理后台</h1>
      <p>注册用户、使用情况与用户反馈（仅管理员可见）。</p>
    </div>

    <div class="adm-summary">
      <div class="adm-card"><div class="num" id="s-users">—</div><div class="lbl">注册用户</div></div>
      <div class="adm-card"><div class="num" id="s-jobs">—</div><div class="lbl">任务总数</div></div>
      <div class="adm-card"><div class="num" id="s-active">—</div><div class="lbl">活跃任务</div></div>
      <div class="adm-card"><div class="num" id="s-fb">—</div><div class="lbl">反馈总数</div></div>
    </div>

    <div class="adm-sec-title">用户列表 · 使用情况</div>
    <table class="adm-table">
      <thead>
        <tr>
          <th>邮箱</th><th>角色</th><th>注册时间</th>
          <th>任务（总 / 成 / 败 / 活跃）</th><th>最近任务</th><th>反馈</th>
        </tr>
      </thead>
      <tbody id="tbl-users"></tbody>
    </table>
    <div class="adm-note">任务统计为全量聚合；「最近任务」取该用户最后一次创建任务的时间。</div>

    <div class="adm-sec-title">用户反馈</div>
    <div id="fb-list"></div>
  </div>
  <div id="admin-denied" class="empty-state" hidden>
    <p>需要管理员权限才能查看管理后台。</p>
    <p class="empty-sub">请使用管理员账号登录。</p>
  </div>
</main>

<script src="/config.js"></script>
<script src="/vendor/supabase/supabase.min.js"></script>
<script>
(function () {
  const CFG = window.DSH_CONFIG || {};
  const supabase = window.supabase ? window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY) : null;
  let session = null;
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const apiFetch = (url, opts = {}) => fetch(url, {
    ...opts,
    headers: { ...(session ? { Authorization: `Bearer ${session.access_token}` } : {}), ...(opts.headers || {}) },
  });
  const fmtTime = (iso) => {
    if (!iso) return '—';
    const d = new Date(iso);
    return d.toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
  };
  const CAT = { general: '一般', bug: 'Bug', suggestion: '建议' };

  async function loadAdmin() {
    const [u, f] = await Promise.all([
      apiFetch('/api/admin/users').then((r) => r.json()).catch(() => null),
      apiFetch('/api/admin/feedback').then((r) => r.json()).catch(() => null),
    ]);
    if (!u) { document.getElementById('admin-denied').hidden = false; return; }
    document.getElementById('admin-body').hidden = false;

    const s = u.summary || {};
    document.getElementById('s-users').textContent = s.users ?? '—';
    document.getElementById('s-jobs').textContent = s.totalJobs ?? '—';
    document.getElementById('s-active').textContent = s.activeJobs ?? '—';
    document.getElementById('s-fb').textContent = s.feedback ?? '—';

    const tbody = document.getElementById('tbl-users');
    tbody.innerHTML = (u.users || []).map((x) => {
      const st = x.stats || {};
      return `<tr>
        <td>${esc(x.email || x.userId)}</td>
        <td><span class="pill-role ${x.role === 'admin' ? '' : 'user'}">${x.role === 'admin' ? 'ADMIN' : 'USER'}</span></td>
        <td class="mono dim">${fmtTime(x.createdAt)}</td>
        <td class="mono">${st.total || 0} / ${st.done || 0} / ${st.error || 0} / ${st.active || 0}</td>
        <td class="mono dim">${st.lastAt ? fmtTime(st.lastAt) : '—'}</td>
        <td class="mono">${x.feedbackCount || 0}</td>
      </tr>`;
    }).join('') || '<tr><td colspan="6" class="fb-empty">暂无用户</td></tr>';

    const fb = document.getElementById('fb-list');
    fb.innerHTML = (f?.feedback || []).map((x) => `
      <div class="fb-item">
        <div class="fb-top">
          <span class="fb-mail">${esc(x.email || '匿名')}</span>
          <span class="pill-cat ${x.category === 'bug' ? 'bug' : ''}">${CAT[x.category] || x.category}</span>
          <span class="mono dim" style="font-size:10px">${esc(x.status)}</span>
          <span class="fb-time">${fmtTime(x.createdAt)}</span>
        </div>
        <div class="fb-body">${esc(x.content)}</div>
      </div>`).join('') || '<div class="fb-empty">暂无反馈</div>';
  }

  document.getElementById('btn-logout').addEventListener('click', async () => {
    try { await supabase.auth.signOut(); } catch { /* ignore */ }
    location.replace('/login.html');
  });

  (async () => {
    if (!supabase) return;
    const { data } = await supabase.auth.getSession();
    session = data.session;
    if (!session) { location.replace('/login.html'); return; }
    // 角色校验：仅 admin 可见管理后台
    let role = 'user';
    try {
      const { data: prof } = await supabase.from('profiles').select('role').eq('user_id', session.user.id).single();
      if (prof && prof.role) role = prof.role;
    } catch { /* 默认 user */ }
    document.body.classList.remove('boot-pending');
    const bs = document.getElementById('boot-screen');
    if (bs) bs.remove();
    if (role !== 'admin') { document.getElementById('admin-denied').hidden = false; return; }
    loadAdmin();
  })();
})();
</script>
</body>
</html>
